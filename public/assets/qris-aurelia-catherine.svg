  <g fill="#1e293b">
    <rect x="160" y="150" width="12" height="12" rx="2"/>
    <rect x="184" y="150" width="24" height="12" rx="2"/>
    <rect x="220" y="150" width="12" height="24" rx="2"/>

    <rect x="160" y="174" width="24" height="12" rx="2"/>
    <rect x="196" y="174" width="12" height="24" rx="2"/>
    <rect x="232" y="174" width="12" height="12" rx="2"/>

    <rect x="160" y="200" width="12" height="36" rx="2"/>
    <rect x="184" y="210" width="36" height="12" rx="2"/>
    <rect x="232" y="200" width="24" height="12" rx="2"/>

    <rect x="90" y="220" width="12" height="24" rx="2"/>
    <rect x="114" y="220" width="24" height="12" rx="2"/>
    <rect x="134" y="244" width="12" height="24" rx="2"/>
    
    <rect x="254" y="220" width="36" height="12" rx="2"/>
    <rect x="278" y="244" width="24" height="24" rx="2"/>
    <rect x="254" y="280" width="12" height="24" rx="2"/>

    <rect x="90" y="268" width="24" height="12" rx="2"/>
    <rect x="126" y="268" width="12" height="12" rx="2"/>
    <rect x="114" y="292" width="24" height="12" rx="2"/>

    <rect x="160" y="250" width="36" height="12" rx="2"/>
    <rect x="210" y="250" width="12" height="36" rx="2"/>
    <rect x="172" y="274" width="24" height="24" rx="2"/>

    <rect x="160" y="314" width="24" height="12" rx="2"/>
    <rect x="196" y="314" width="12" height="36" rx="2"/>
    <rect x="220" y="326" width="36" height="12" rx="2"/>

    <rect x="160" y="350" width="12" height="20" rx="2"/>
    <rect x="184" y="362" width="24" height="8" rx="2"/>
    <rect x="240" y="350" width="24" height="20" rx="2"/>
    <rect x="276" y="326" width="34" height="12" rx="2"/>
    <rect x="276" y="350" width="12" height="20" rx="2"/>
