  <text x="200" y="415" fill="#475569" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Mendukung Seluruh Bank &amp; E-Wallet Indonesia</text>
  <text x="200" y="432" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">BCA • Mandiri • BRI • BNI • GoPay • OVO • DANA • ShopeePay</text>
  <text x="200" y="452" fill="#0284c7" font-family="system-ui, sans-serif" font-size="9" font-weight="700" text-anchor="middle">AURELIA CATHĒRINE VERIFIED MERCHANT</text>
