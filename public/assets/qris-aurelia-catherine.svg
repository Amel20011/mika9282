<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" width="100%" height="100%">
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.1" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect x="10" y="10" width="380" height="460" rx="20" fill="#ffffff" stroke="#e0f2fe" stroke-width="2" filter="url(#shadow)"/>

  <!-- QRIS Header Banner -->
  <path d="M 10 30 Q 10 10 30 10 L 370 10 Q 390 10 390 30 L 390 75 L 10 75 Z" fill="url(#headerGrad)"/>
  
  <text x="200" y="44" fill="#ffffff" font-family="system-ui, sans-serif" font-size="19" font-weight="800" text-anchor="middle" letter-spacing="1">QRIS PEMBAYARAN MANUAL</text>
  <text x="200" y="62" fill="#bae6fd" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle" letter-spacing="0.5">STANDAR PEMBAYARAN NASIONAL INDONESIA</text>

  <!-- Merchant Information -->
  <text x="200" y="102" fill="#0f172a" font-family="system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="middle">PT AURELIA CATHERINE DIGITAL</text>
  <text x="200" y="118" fill="#64748b" font-family="system-ui, sans-serif" font-size="10" font-weight="600" text-anchor="middle" letter-spacing="0.5">NMID: ID1020038891024 • A01</text>

  <!-- QR Outer Border -->
  <rect x="70" y="130" width="260" height="260" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- QR Finder Patterns (Top-Left, Top-Right, Bottom-Left) -->
  <!-- Top-Left Finder -->
  <rect x="90" y="150" width="56" height="56" rx="8" fill="#0369a1"/>
  <rect x="98" y="158" width="40" height="40" rx="4" fill="#ffffff"/>
  <rect x="106" y="166" width="24" height="24" rx="2" fill="#0f172a"/>

  <!-- Top-Right Finder -->
  <rect x="254" y="150" width="56" height="56" rx="8" fill="#0369a1"/>
  <rect x="262" y="158" width="40" height="40" rx="4" fill="#ffffff"/>
  <rect x="270" y="166" width="24" height="24" rx="2" fill="#0f172a"/>

  <!-- Bottom-Left Finder -->
  <rect x="90" y="314" width="56" height="56" rx="8" fill="#0369a1"/>
  <rect x="98" y="322" width="40" height="40" rx="4" fill="#ffffff"/>
  <rect x="106" y="330" width="24" height="24" rx="2" fill="#0f172a"/>

